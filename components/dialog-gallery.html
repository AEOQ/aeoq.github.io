<!DOCTYPE html>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>dialog-gallery</title>
<script type="module" src="../dialog-gallery.mjs"></script>
<style>
    img {height: 10em;}
</style>
<a href="#gallery">OPEN</a>
<dialog-gallery id="gallery">
</dialog-gallery>
<script type="module">
    import { A, E, O, Q } from 'https://aeoq.github.io/AEOQ.mjs';window.Q=Q;window.E=E;
    for (let h = 50; h <= 85; h += 5) {
        Q(`#gallery`).append(E('figure', [...Array(10)].map((_, i) => E('img', {src: `https://go-shoot.github.io/x/img/ratchet/${i}-${h}.png`}))))
    }
</script>
